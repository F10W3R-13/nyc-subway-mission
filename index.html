<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Speaking Missions</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/shell.css">
<style>
.lead{margin:var(--s4) 0 0;font-size:19px;line-height:1.55;max-width:62ch;color:var(--ink)}
.mission{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:var(--s6)}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:var(--s3)}
.opt{display:flex;gap:var(--s3);align-items:flex-start;border:1px solid var(--line-2);border-radius:var(--r);padding:var(--s4);font-size:17px;line-height:1.45}
.opt .k{flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:700;color:var(--tc);background:var(--tbg)}
.opt .k svg{width:14px;height:14px}
.cond{margin:var(--s5) 0 0;display:flex;gap:var(--s3);align-items:baseline;flex-wrap:wrap;background:var(--note);color:var(--note-ink);border-radius:var(--r);padding:var(--s3) var(--s4);font-size:17px}
.cond strong{font-size:13px;font-weight:600}
audio{width:100%;display:block}
.menu{width:100%;border-collapse:collapse;font-size:15px;font-variant-numeric:tabular-nums}
.menu td{padding:8px 0;border-bottom:1px solid var(--line)}
.menu tr:last-child td{border-bottom:0}
.menu td:last-child{text-align:right;white-space:nowrap;color:var(--muted);padding-left:var(--s4)}
.go{margin-top:var(--s5);padding-top:var(--s5);border-top:1px solid var(--line);display:grid;gap:var(--s3)}
.go .who{display:flex;gap:var(--s3);align-items:center;flex-wrap:wrap}
.go label{font-size:14px;font-weight:600}
.go input{font:inherit;font-size:16px;padding:10px 12px;border:1px solid var(--line-2);border-radius:var(--r-s);width:min(240px,100%)}
.go input:focus-visible{outline:2px solid var(--tc);outline-offset:1px}
.call-btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:14px 18px;border:0;border-radius:var(--r);background:var(--tc);color:#fff;font-size:17px;font-weight:600;cursor:pointer;transition:filter .15s,transform .15s}
.call-btn:hover{filter:brightness(.93)}
.call-btn:active{transform:translateY(1px)}
.call-btn:disabled{opacity:.45;cursor:default;filter:none}
.call-btn svg{width:20px;height:20px}
.call-btn.live{background:var(--ink)}
.call-btn .dot{width:8px;height:8px;border-radius:50%;background:#ff5a4f;animation:pulse 1.4s ease-out infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,90,79,.6)}100%{box-shadow:0 0 0 10px rgba(255,90,79,0)}}
@media (prefers-reduced-motion:reduce){.call-btn .dot{animation:none}}
.go .note{margin:0;font-size:14px;color:var(--muted)}
.done{display:flex;gap:var(--s3);align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--okbg);border:1px solid var(--okline);border-radius:var(--r);padding:var(--s3) var(--s4);color:var(--ok);font-weight:600}
.done .acts{display:flex;gap:var(--s2)}
.done button{font-size:14px;padding:7px 12px;border-radius:var(--r-s);border:1px solid var(--okline);background:#fff;color:var(--ink);cursor:pointer;font-weight:500}
.done button.next{background:var(--ink);border-color:var(--ink);color:#fff}
@media (pointer:coarse){.done button{min-height:44px}}
@media (max-width:560px){.menu tr{display:flex;flex-wrap:wrap;justify-content:space-between;column-gap:var(--s3);border-bottom:1px solid var(--line);padding:8px 0}.menu tr:last-child{border-bottom:0}.menu td{border:0;padding:0}.menu td:last-child{white-space:normal;padding-left:0;margin-left:auto}}
.mission-wrap{min-width:0}
@media (max-width:820px){.mission{padding:var(--s5)}.lead{font-size:18px}}
</style></head><body>
<header class="top"><div class="in">
  <a class="brand" href="/">Speaking Missions</a>
  <nav class="switch" aria-label="Pages"><a href="/" aria-current="page">Missions</a><a href="/judge.html">AI judge</a></nav>
</div></header>
<div class="frame">
  <nav class="missions" id="nav" aria-label="Missions"></nav>
  <main class="mission-wrap" id="wrap">
    <article class="mission">
      <div class="head"><h1 id="title"></h1><p class="meta" id="meta"></p></div>
      <p class="lead" id="front"></p>
      <section class="sec" id="annBox"><h2>Listen first</h2><audio id="ann" controls preload="none"></audio></section>
      <section class="sec"><h2 id="optLabel"></h2><div class="opts" id="opts"></div></section>
      <p class="cond"><strong id="condLabel"></strong><span id="cond"></span></p>
      <div class="go" id="go">
        <div class="who"><label for="who">Your name</label><input id="who" autocomplete="name" maxlength="40" placeholder="e.g. Minwoo"></div>
        <button class="call-btn" id="callBtn" type="button"></button>
        <p class="note" id="callNote" aria-live="polite"></p>
      </div>
      <section class="sec" id="menuBox" hidden><h2>Menu</h2><table class="menu" id="menu"></table></section>
    </article>
  </main>
</div>
<div id="agentSlot"></div>
<script src="/shell.js"></script>
<script>
let M = [];  // loaded from /missions.json, the single source for both pages
const COPY = {
  attendant:{opt:"Choose one", cond:"Your situation", start:"Talk to the station attendant"},
  chat:{opt:"Your tasks", cond:"Your goal", start:"Answer the call"},
  order:{opt:"Your tasks", cond:"Remember", start:"Start ordering"}
};
const MIC = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><path d="M12 19v3"/></svg>';
const CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>';
const $ = id => document.getElementById(id);
const esc = s => String(s||"").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let cur = 0;
function render(){
  const m = M[cur], T = Shell.TYPES[m.type], C = COPY[m.type], att = m.type === "attendant";
  Shell.render($("nav"), M, cur);
  $("wrap").style.setProperty("--tc", T.color); $("wrap").style.setProperty("--tbg", T.bg);
  document.title = `${Shell.clean(m.title)} · Speaking Missions`;
  $("title").textContent = Shell.clean(m.title);
  $("meta").innerHTML = `<span class="type" style="color:${T.color}">${T.name}</span><span aria-hidden="true">·</span><span>Mission ${cur+1} of ${M.length}</span>` + (m.fictional ? '<span class="tag">classroom scenario</span>' : "");
  const a = $("ann"); $("annBox").hidden = !att;
  if (att) a.src = `https://cdn.jsdelivr.net/gh/F10W3R-13/nyc-subway-mission@main/audio/${m.audio}`; else { a.pause(); a.removeAttribute("src"); }
  $("front").textContent = m.front;
  $("menuBox").hidden = !m.menu; if (m.menu) $("menu").innerHTML = m.menu.map(([n,p]) => `<tr><td>${esc(n)}</td><td>${esc(p)}</td></tr>`).join("");
  $("optLabel").textContent = C.opt; $("condLabel").textContent = C.cond;
  $("opts").innerHTML = m.options.map((o,i) => `<div class="opt"><span class="k">${att ? "AB"[i] : CHECK}</span><span>${esc(o)}</span></div>`).join("");
  $("cond").textContent = m.condition;
  const slot = $("agentSlot"); slot.innerHTML = "";
  agent = document.createElement("fish-agent"); agent.setAttribute("agent-id", m.agent);
  if (studentName()) agent.setAttribute("user-id", studentName());
  slot.appendChild(agent); hideLauncher(agent);
  agent.addEventListener("fish-agent:call", e => {
    const name = studentName();
    if (e.detail && e.detail.options && name) { e.detail.options.endUserId = name; e.detail.options.metadata = { ...(e.detail.options.metadata || {}), student: name, mission: cur + 1 }; }
    setState("connecting");
  });
  agent.addEventListener("fish-agent:connect", () => setState("live"));
  agent.addEventListener("fish-agent:disconnect", () => setState(state === "connecting" ? "idle" : "done"));
  agent.addEventListener("fish-agent:error", () => setState("error"));
  setState("idle");
}
let agent = null, state = "idle";
// The card's button is the only way in, so the name is always asked first: hide the widget's own floating button.
function hideLauncher(el, tries = 0) {
  if (el.shadowRoot && el.shadowRoot.querySelector(".fa-root")) {
    if (!el.shadowRoot.getElementById("hideFab")) { const s = document.createElement("style"); s.id = "hideFab"; s.textContent = ".fa-collapsed{display:none!important}"; el.shadowRoot.appendChild(s); }
  } else if (tries < 100) setTimeout(() => hideLauncher(el, tries + 1), 100);
}
const studentName = () => $("who").value.trim();
function setState(s) {
  state = s;
  const C = COPY[M[cur].type], btn = $("callBtn"), note = $("callNote"), named = !!studentName();
  $("go").querySelector(".done")?.remove();
  btn.hidden = s === "done"; btn.disabled = !named && s === "idle"; btn.classList.toggle("live", s === "live" || s === "connecting");
  if (s === "idle") { btn.innerHTML = MIC + C.start; note.textContent = named ? "Your partner's window will open. Allow the microphone when asked." : "Type your name first, so your teacher can find your call."; }
  if (s === "connecting") { btn.innerHTML = '<span class="dot"></span>Connecting…'; note.textContent = "Allow the microphone if your browser asks."; }
  if (s === "live") { btn.innerHTML = '<span class="dot"></span>On the call'; note.textContent = "Speak naturally. Hang up in the call window when you are finished. Closed the window? Tap the button to bring it back."; }
  if (s === "error") { btn.innerHTML = MIC + "Try again"; btn.disabled = false; note.textContent = "The call could not start. Check your microphone and internet, then try again."; }
  if (s === "done") {
    note.textContent = "";
    const d = document.createElement("div"); d.className = "done";
    d.innerHTML = `<span>Call finished. Nice work!</span><span class="acts"><button type="button" data-a="again">Try again</button>${cur < M.length - 1 ? '<button type="button" class="next" data-a="next">Next mission →</button>' : ""}</span>`;
    d.addEventListener("click", e => { const a = e.target.dataset.a; if (a === "again") setState("idle"); if (a === "next") { cur++; render(); window.scrollTo({ top: 0, behavior: "smooth" }); } });
    $("go").insertBefore(d, note);
  }
}
$("who").addEventListener("input", () => { try { localStorage.setItem("studentName", studentName()); } catch {} if (agent && studentName()) agent.setAttribute("user-id", studentName()); if (state === "idle") setState("idle"); });
$("callBtn").addEventListener("click", () => {
  if (!studentName()) { $("who").focus(); return; }
  (agent || document).dispatchEvent(new CustomEvent("fish-agent:expand", { bubbles: true, composed: true }));
});
try { $("who").value = localStorage.getItem("studentName") || ""; } catch {}
$("nav").addEventListener("click", e => { const b = e.target.closest("button"); if (!b) return; cur = +b.dataset.i; render(); window.scrollTo({top:0, behavior:"smooth"}); });
fetch("/missions.json").then(r => { if (!r.ok) throw 0; return r.json(); })
  .then(d => { M = d; cur = Shell.startIndex(M.length); render(); })
  .catch(() => { $("title").textContent = "Could not load the missions"; $("front").textContent = "Check your internet connection, then reload the page."; $("go").hidden = true; });
</script>
<script src="https://unpkg.com/@fishaudio/agent-widget-embed" async type="text/javascript"></script>
</body></html>
