<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>NYC Subway Mission</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#1d1f24;--muted:#6b6f78;--line:#e3e5e9;--bg:#f6f7f9;--accent:#0039a6;--fish-accent:#0039a6}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;color:var(--ink);background:var(--bg)}
header{background:var(--accent);color:#fff;padding:16px 24px;display:flex;align-items:center;gap:12px}
header .dot{width:30px;height:30px;border-radius:50%;background:#fff;color:var(--accent);display:grid;place-items:center;font-weight:600}
header h1{margin:0;font-size:19px;font-weight:600}
main{max-width:900px;margin:0 auto;padding:22px 24px 120px;display:grid;gap:18px}
.tabs{display:flex;flex-wrap:wrap;gap:8px}
.tabs button{border:1px solid var(--line);background:#fff;padding:8px 14px;border-radius:999px;font:inherit;font-size:14px;cursor:pointer}
.tabs button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:24px 28px}
.label{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:0 0 6px}
.front{font-size:22px;line-height:1.5;margin:0 0 20px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:0 0 20px}
.opt{border:1px solid var(--line);border-radius:10px;padding:14px 16px;font-size:18px}
.opt b{color:var(--accent);margin-right:6px}
.cond{font-size:19px;margin:0;padding:12px 16px;background:#fff7e0;border-radius:10px}
.hint{color:var(--muted);font-size:14px;text-align:center}
@media(max-width:640px){.opts{grid-template-columns:1fr}}
</style></head><body>
<header><div class="dot">M</div><h1>NYC Subway Mission</h1></header>
<main>
<div class="tabs" id="tabs"></div>
<section class="card">
<p class="label">Announcement</p><audio id="ann" controls preload="none" style="width:100%;margin:0 0 20px"></audio>
<p class="label">Your mission</p><p class="front" id="front"></p>
<p class="label">Choose one</p><div class="opts" id="opts"></div>
<p class="label">Your situation</p><p class="cond" id="cond"></p>
</section>
<p class="hint">Tap the button at the bottom right to talk to the station attendant.</p>
</main>
<div id="agentSlot"></div>
<script>
const M = [{"title": "1. Express skips a stop", "front": "You are on an uptown A train at 42 St–Port Authority. Choose where you want to go, then ask the station attendant for help. Tell the attendant about your situation.", "options": ["American Museum of Natural History", "Apollo Theater in Harlem"], "condition": "You are in a hurry.", "agent": "d26e442b87bf4d2fa61e77e5c2571394"}, {"title": "2. Which platform?", "front": "You are on the 1 train platform at Times Sq–42 St. The sign says “Uptown & The Bronx.” A train is coming. Choose where you want to go and ask the attendant if this is the right train.", "options": ["Staten Island Ferry", "Central Park (Columbus Circle)"], "condition": "You don't want to change trains.", "agent": "a353ccbcc46743609b33bdd0294201c2"}, {"title": "3. Late night, no C train", "front": "It is 1 a.m. You are at 42 St–Port Authority. Your friend told you to take the C train to your hotel. Choose your hotel and ask the attendant how to get there.", "options": ["Hotel near the Museum of Natural History", "Hotel near Penn Station"], "condition": "You are very tired and want the simplest way.", "agent": "9b3af95cbea7486b99a34a6f3030f2d5"}, {"title": "4. Station skipped (classroom scenario)", "front": "You are on an uptown C train at 59 St–Columbus Circle. Choose where you want to go. Listen to the announcement, then ask the attendant for help.", "options": ["Strawberry Fields in Central Park", "American Museum of Natural History"], "condition": "You don't want to walk much.", "agent": "e4830977e8cd451faa1b753adaf6e813"}, {"title": "5. Transfer needed", "front": "You are on an uptown 2 train at 34 St–Penn Station. Choose where you want to go and ask the attendant how to get there.", "options": ["Grand Central Terminal", "Central Park (Columbus Circle)"], "condition": "You want the fastest way.", "agent": "b9b4d41935a74fd8a11dfeefae2467aa"}, {"title": "6. Which exit?", "front": "You are on an uptown C train at 59 St–Columbus Circle. Choose which part of the museum you want to visit and ask the attendant where to get off and which exit to use.", "options": ["Museum's main entrance (dinosaurs)", "Rose Center for Earth and Space (planetarium, on 81st Street)"], "condition": "You want to walk outside as little as possible.", "agent": "593137b8195f4afda7e33150587e4ab3"}];
let cur=0;const $=id=>document.getElementById(id);
function render(){
 const m=M[cur];
 $("tabs").innerHTML=M.map((k,i)=>`<button class="${i===cur?'on':''}" data-i="${i}">${k.title}</button>`).join("");
 $("front").textContent=m.front;
 const a=$("ann"); a.src=`https://cdn.jsdelivr.net/gh/F10W3R-13/nyc-subway-mission@main/audio/a${cur+1}.mp3`;
 $("opts").innerHTML=m.options.map((o,i)=>`<div class="opt"><b>${"AB"[i]}</b>${o}</div>`).join("");
 $("cond").textContent=m.condition;
 const slot=$("agentSlot");slot.innerHTML="";
 const el=document.createElement("fish-agent");el.setAttribute("agent-id",m.agent);slot.appendChild(el);
}
$("tabs").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;cur=+b.dataset.i;render();});
render();
</script>
<script src="https://unpkg.com/@fishaudio/agent-widget-embed" async type="text/javascript"></script>
</body></html>
