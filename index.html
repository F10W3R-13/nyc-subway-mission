<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Speaking Missions</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/shell.css">
<style>
.lead{margin:var(--s4) 0 0;font-size:19px;line-height:1.55;max-width:62ch;color:var(--ink)}
.mission{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:var(--s6)}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:var(--s3)}
.opt{display:flex;gap:var(--s3);align-items:flex-start;border:1px solid var(--line-2);border-radius:var(--r);padding:var(--s4);font-size:17px;line-height:1.45}
.opt .k{flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:700;color:var(--tc);background:var(--tbg)}
.opt .k svg{width:14px;height:14px}
.cond{margin:var(--s5) 0 0;display:flex;gap:var(--s3);align-items:baseline;flex-wrap:wrap;background:var(--note);color:var(--note-ink);border-radius:var(--r);padding:var(--s3) var(--s4);font-size:17px}
.cond strong{font-size:13px;font-weight:600}
audio{width:100%;display:block}
.menu{width:100%;border-collapse:collapse;font-size:15px;font-variant-numeric:tabular-nums}
.menu td{padding:8px 0;border-bottom:1px solid var(--line)}
.menu tr:last-child td{border-bottom:0}
.menu td:last-child{text-align:right;white-space:nowrap;color:var(--muted);padding-left:var(--s4)}
.start{margin-top:var(--s4);display:flex;gap:var(--s3);align-items:center;color:var(--muted);font-size:14px}
.start svg{flex:none;width:18px;height:18px;color:var(--tc)}
.mission-wrap{min-width:0}
@media (max-width:820px){.mission{padding:var(--s5)}.lead{font-size:18px}}
</style></head><body>
<header class="top"><div class="in">
  <a class="brand" href="/">Speaking Missions</a>
  <nav class="switch" aria-label="Pages"><a href="/" aria-current="page">Missions</a><a href="/judge.html">AI judge</a></nav>
</div></header>
<div class="frame">
  <nav class="missions" id="nav" aria-label="Missions"></nav>
  <main class="mission-wrap" id="wrap">
    <article class="mission">
      <div class="head"><h1 id="title"></h1><p class="meta" id="meta"></p></div>
      <p class="lead" id="front"></p>
      <section class="sec" id="annBox"><h2>Listen first</h2><audio id="ann" controls preload="none"></audio></section>
      <section class="sec" id="menuBox" hidden><h2>Menu</h2><table class="menu" id="menu"></table></section>
      <section class="sec"><h2 id="optLabel"></h2><div class="opts" id="opts"></div></section>
      <p class="cond"><strong id="condLabel"></strong><span id="cond"></span></p>
    </article>
    <p class="start"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><path d="M12 19v3"/></svg><span id="hint"></span></p>
  </main>
</div>
<div id="agentSlot"></div>
<script src="/shell.js"></script>
<script>
const M = [{"type": "attendant", "title": "Express skips a stop", "front": "You are on an uptown A train at 42 St–Port Authority. Choose where you want to go, then ask the station attendant for help. Tell the attendant about your situation.", "options": ["American Museum of Natural History", "Apollo Theater in Harlem"], "condition": "You are in a hurry.", "fictional": false, "audio": "a1.mp3", "agent": "d26e442b87bf4d2fa61e77e5c2571394"}, {"type": "attendant", "title": "Station skipped (classroom scenario)", "front": "You are on an uptown C train at 59 St–Columbus Circle. Choose where you want to go. Listen to the announcement, then ask the attendant for help.", "options": ["Strawberry Fields in Central Park", "American Museum of Natural History"], "condition": "You don't want to walk much.", "fictional": true, "audio": "a4.mp3", "agent": "e4830977e8cd451faa1b753adaf6e813"}, {"type": "chat", "title": "Phone call: How's New York?", "front": "Your friend Emma from Chicago is calling you. She wants to hear about your trip to New York.", "options": ["Tell her about one place you visited and how it was.", "Tell her about one food you tried and what you thought."], "condition": "Answer with details, not just yes or no.", "agent": "9b3af95cbea7486b99a34a6f3030f2d5"}, {"type": "chat", "title": "Phone call: Let's hang out!", "front": "Your friend Maya lives in New York. She is calling to make plans to meet you.", "options": ["You really want Korean food. Convince Maya, and give your reasons.", "Agree on a day, a time, and a place to meet."], "condition": "Answer with details, not just yes or no.", "agent": "b9b4d41935a74fd8a11dfeefae2467aa"}, {"type": "order", "title": "McDonald's drive-thru", "agent": "a353ccbcc46743609b33bdd0294201c2", "front": "You are on a road trip with a friend. You are at a McDonald's drive-thru. Order for both of you through the speaker.", "options": ["Your friend wants a McChicken meal with a Sprite.", "Choose something for yourself from the menu."], "condition": "You don't like pickles.", "menu": [["Big Mac", "$6.49"], ["Quarter Pounder with Cheese", "$6.79"], ["McChicken", "$3.29"], ["10 pc Chicken McNuggets", "$6.29"], ["Filet-O-Fish", "$5.49"], ["Make it a meal (medium fries + medium drink)", "+$4.00"], ["Fries  S / M / L", "$2.49 / $3.49 / $4.29"], ["Drink (Coke, Diet Coke, Sprite, iced tea)  S / M / L", "$1.79 / $2.29 / $2.79"], ["McFlurry with Oreo", "$4.49"], ["Apple Pie", "$1.79"]]}, {"type": "order", "title": "McDonald's counter (something's sold out)", "agent": "593137b8195f4afda7e33150587e4ab3", "front": "You are at a busy McDonald's in Times Square. Order a meal and a dessert at the counter.", "options": ["Order a meal and a dessert.", "Ask for one special thing (extra sauce, no ice, no onions…)."], "condition": "If something isn't available, choose something else.", "menu": [["Big Mac", "$6.49"], ["Quarter Pounder with Cheese", "$6.79"], ["McChicken", "$3.29"], ["10 pc Chicken McNuggets", "$6.29"], ["Filet-O-Fish", "$5.49"], ["Make it a meal (medium fries + medium drink)", "+$4.00"], ["Fries  S / M / L", "$2.49 / $3.49 / $4.29"], ["Drink (Coke, Diet Coke, Sprite, iced tea)  S / M / L", "$1.79 / $2.29 / $2.79"], ["McFlurry with Oreo", "$4.49"], ["Apple Pie", "$1.79"]]}];
const COPY = {
  attendant:{opt:"Choose one", cond:"Your situation", hint:"Tap the button at the bottom right to talk to the station attendant."},
  chat:{opt:"Try to", cond:"Your goal", hint:"Tap the button at the bottom right to answer the call."},
  order:{opt:"Try to", cond:"Remember", hint:"Tap the button at the bottom right to start ordering."}
};
const CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>';
const $ = id => document.getElementById(id);
const esc = s => String(s||"").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let cur = Shell.startIndex(M.length);
function render(){
  const m = M[cur], T = Shell.TYPES[m.type], C = COPY[m.type], att = m.type === "attendant";
  Shell.render($("nav"), M, cur);
  $("wrap").style.setProperty("--tc", T.color); $("wrap").style.setProperty("--tbg", T.bg);
  document.title = `${Shell.clean(m.title)} · Speaking Missions`;
  $("title").textContent = Shell.clean(m.title);
  $("meta").innerHTML = `<span class="type" style="color:${T.color}">${T.name}</span><span aria-hidden="true">·</span><span>Mission ${cur+1} of ${M.length}</span>` + (m.fictional ? '<span class="tag">classroom scenario</span>' : "");
  const a = $("ann"); $("annBox").hidden = !att;
  if (att) a.src = `https://cdn.jsdelivr.net/gh/F10W3R-13/nyc-subway-mission@main/audio/${m.audio}`; else { a.pause(); a.removeAttribute("src"); }
  $("front").textContent = m.front;
  $("menuBox").hidden = !m.menu; if (m.menu) $("menu").innerHTML = m.menu.map(([n,p]) => `<tr><td>${esc(n)}</td><td>${esc(p)}</td></tr>`).join("");
  $("optLabel").textContent = C.opt; $("condLabel").textContent = C.cond; $("hint").textContent = C.hint;
  $("opts").innerHTML = m.options.map((o,i) => `<div class="opt"><span class="k">${att ? "AB"[i] : CHECK}</span><span>${esc(o)}</span></div>`).join("");
  $("cond").textContent = m.condition;
  const slot = $("agentSlot"); slot.innerHTML = "";
  const el = document.createElement("fish-agent"); el.setAttribute("agent-id", m.agent); slot.appendChild(el);
}
$("nav").addEventListener("click", e => { const b = e.target.closest("button"); if (!b) return; cur = +b.dataset.i; render(); window.scrollTo({top:0, behavior:"smooth"}); });
render();
</script>
<script src="https://unpkg.com/@fishaudio/agent-widget-embed" async type="text/javascript"></script>
</body></html>
