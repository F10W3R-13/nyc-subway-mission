<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI judge · Speaking Missions</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/shell.css">
<style>:root{--frame-pb:48px}</style>
<style>
  .calls{display:flex;flex-wrap:wrap;gap:var(--s2)}
  .call{border:1px solid var(--line-2);background:var(--card);border-radius:var(--r-s);padding:8px 12px;font-size:14px;cursor:pointer;font-variant-numeric:tabular-nums;display:flex;gap:var(--s2);align-items:baseline}
  .call:hover{background:var(--hover)}
  .call.on{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
  .call .d{color:var(--muted);font-size:13px}
  .call .new{font-size:11px;font-weight:600;color:var(--ok);background:var(--okbg);border-radius:999px;padding:1px 6px}
  .status{margin:var(--s3) 0 0;font-size:14px;color:var(--muted);min-height:21px}
  .status.err{color:var(--no)}
  .status:empty{display:none}
  .bar{margin-top:var(--s3);height:4px;border-radius:999px;background:var(--line);overflow:hidden}
  .bar i{display:block;height:100%;width:0;background:var(--ink);border-radius:inherit;transition:width .4s ease-out}
  .call .who{font-weight:600}
  .call .ear{font-size:11px;color:var(--muted);border:1px solid var(--line-2);border-radius:999px;padding:0 6px}
  .call:disabled{opacity:.5;cursor:default}
  #checkPanel.loading ol.check{opacity:.45}
  details.paste{margin-top:var(--s4);border-top:1px solid var(--line);padding-top:var(--s3)}
  details.paste summary{cursor:pointer;font-size:14px;color:var(--muted);width:max-content}
  details.paste summary:hover{color:var(--ink)}
  textarea{width:100%;min-height:150px;margin-top:var(--s3);font:inherit;font-size:14px;line-height:1.5;padding:var(--s3);border:1px solid var(--line-2);border-radius:var(--r-s);resize:vertical}
  .row{display:flex;gap:var(--s2);flex-wrap:wrap;align-items:center;margin-top:var(--s3)}

  .verdict{display:flex;align-items:baseline;gap:var(--s3);flex-wrap:wrap;margin-bottom:var(--s2)}
  .verdict b{font-size:26px;font-weight:700;letter-spacing:-.01em}
  .verdict.ok b{color:var(--ok)} .verdict.no b{color:var(--no)}
  .verdict span{font-size:14px;color:var(--muted)}
  .summary{margin:0 0 var(--s5);font-size:16px;line-height:1.65;max-width:68ch}
  ol.check{margin:0;padding:0;list-style:none;display:grid;gap:var(--s2);counter-reset:c}
  ol.check li{counter-increment:c;display:flex;gap:var(--s3);align-items:flex-start;font-size:16px;line-height:1.45;padding:var(--s3);border:1px solid var(--line);border-radius:var(--r-s)}
  ol.check li::before{content:counter(c);flex:none;width:24px;height:24px;border-radius:50%;background:var(--bg);display:grid;place-items:center;font-size:12px;font-weight:600}
  ol.check li.yes{background:var(--okbg);border-color:var(--okline)} ol.check li.yes::before{content:"✓";background:var(--ok);color:#fff}
  ol.check li.no{background:var(--nobg);border-color:var(--noline)} ol.check li.no::before{background:var(--no);color:#fff}
  .ans{color:var(--muted);font-size:14px;margin-top:2px;display:none}
  .show-ans .ans{display:block}
  .fb{font-size:14px;color:var(--ink-2);margin-top:4px;line-height:1.5}
  .fb q{color:var(--ink);font-style:normal}
  .fb .v{color:var(--muted);font-variant-numeric:tabular-nums}
  .human{display:flex;gap:var(--s3);align-items:center;font-size:15px;margin-top:var(--s3);padding:var(--s3);border:1px dashed var(--line-2);border-radius:var(--r-s);cursor:pointer}
  .human input{width:18px;height:18px;accent-color:var(--ink)}
  .feedback{margin-top:var(--s6);display:grid;gap:var(--s5)}
  .feedback h3{margin:0 0 var(--s2);font-size:15px;font-weight:600}
  .feedback ul{margin:0;padding:0;list-style:none;display:grid;gap:var(--s3)}
  .feedback li{line-height:1.55}
  .feedback .why{display:block;color:var(--muted);font-size:14px}
  .swap{font-size:15px}
  .swap s{color:var(--muted);text-decoration-color:var(--line-2)}
  .swap b{font-weight:600}
  .next{margin:0;padding:var(--s3) var(--s4);background:var(--note);color:var(--note-ink);border-radius:var(--r-s);line-height:1.6}
  .fine{margin:var(--s4) 0 0;font-size:13px;color:var(--muted)}

  .card-front{margin:0 0 var(--s4);font-size:16px;line-height:1.6;max-width:68ch}
  .card-grid{display:grid;grid-template-columns:1fr 1fr;gap:var(--s5)}
  .card-grid ul{margin:0;padding-left:20px;line-height:1.6}
  .ann{background:#16181d;color:#f0f0ee;border-radius:var(--r-s);padding:var(--s3) var(--s4);font-size:14px;line-height:1.55}
  @media (max-width:820px){.card-grid{grid-template-columns:1fr;gap:var(--s4)}}
</style>
</head>
<body>
<header class="top"><div class="in">
  <a class="brand" href="/">Speaking Missions</a>
  <nav class="switch" aria-label="Pages"><a href="/">Missions</a><a href="/judge.html" aria-current="page">AI judge</a></nav>
  <div class="end"><label class="muted" for="pin">교사 PIN</label><input class="field" id="pin" type="password" autocomplete="off" placeholder="PIN"></div>
</div></header>
<div class="frame">
  <nav class="missions" id="tabs" aria-label="Missions"></nav>
  <main style="min-width:0">
    <div class="head" style="margin-bottom:var(--s5)"><h1 id="title"></h1><p class="meta" id="meta"></p></div>

    <section class="panel">
      <div class="ph"><h2>판정할 통화 고르기</h2><button class="btn ghost small" id="loadCalls" type="button">새로고침</button></div>
      <div class="calls" id="callList"></div>
      <div class="bar" id="bar" hidden><i></i></div>
      <p class="status" id="callsMsg" role="status" aria-live="polite"></p>
      <details class="paste">
        <summary>대화 기록을 직접 붙여넣기</summary>
        <textarea id="tx" placeholder="Student: ...&#10;Partner: ..."></textarea>
        <div class="row"><button class="btn" id="judge" type="button">판정하기</button><button class="btn ghost" id="clear" type="button">지우기</button></div>
      </details>
    </section>

    <section class="panel" id="checkPanel">
      <div id="out" hidden aria-live="polite">
        <div class="verdict" id="verdictRow"><b id="verdict"></b><span id="runs"></span></div>
        <p class="summary" id="summary"></p>
      </div>
      <div class="ph"><h2>체크리스트</h2><button class="btn ghost small" id="toggleAns" type="button">정답 보기</button></div>
      <ol class="check" id="check"></ol>
      <label class="human"><input type="checkbox" id="heard"> 청중 평가: 기록을 보지 않고 귀로만 들어도 이해할 수 있었어요</label>
      <div class="feedback" id="fb" hidden>
        <div><h3>잘한 점</h3><ul id="strengths"></ul></div>
        <div><h3>이렇게도 말할 수 있어요</h3><ul id="tips"></ul></div>
        <div><h3>다음 대화에서 해 볼 것</h3><p class="next" id="next"></p></div>
      </div>
      <p class="fine">AI는 대화 기록으로 과제 수행 여부만 판단해요. 음성 인식이 문법을 다듬을 수 있어서, 문법과 발음의 명확성은 사람이 귀로 판단해요.</p>
    </section>

    <section class="panel">
      <h2>미션 카드 (학생 화면)</h2>
      <p class="card-front" id="front"></p>
      <div class="card-grid">
        <div><h2 class="muted" style="font-size:13px;font-weight:600;margin:0 0 var(--s2)" id="optLabel"></h2><ul id="opts"></ul></div>
        <div><h2 class="muted" style="font-size:13px;font-weight:600;margin:0 0 var(--s2)" id="condLabel"></h2><p style="margin:0;font-size:16px" id="cond"></p></div>
      </div>
      <div id="annBox" class="sec"><h2>안내 방송</h2><div class="ann" id="ann"></div></div>
    </section>
  </main>
</div>

const $ = id => document.getElementById(id);
const esc = s => String(s||"").replace(/[&<>"]/g, ch => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[ch]));
let cur = Shell.startIndex(CARDS.length), busy = false, curSession = null, timer = null;
function heardOf(id) { try { return !!JSON.parse(localStorage.getItem("heard") || "{}")[id]; } catch { return false; } }
function lock(on) {
  $("judge").disabled = on; [...$("callList").children].forEach(b => b.disabled = on);
  $("checkPanel").classList.toggle("loading", on); $("checkPanel").setAttribute("aria-busy", on);
  const bar = $("bar"), fill = bar.firstElementChild; clearInterval(timer);
  if (on) { bar.hidden = false; let p = 0; fill.style.width = "0"; timer = setInterval(() => { p = Math.min(92, p + (92 - p) * 0.08); fill.style.width = p + "%"; }, 500); }
  else { fill.style.width = "100%"; setTimeout(() => { bar.hidden = true; fill.style.width = "0"; }, 400); }
}

function say(msg, isErr) { const s = $("callsMsg"); s.textContent = msg || ""; s.classList.toggle("err", !!isErr); }
function resetResult() {
  $("out").hidden = true; $("fb").hidden = true; $("heard").checked = false;
  [...$("check").children].forEach(li => { li.classList.remove("yes","no"); li.querySelectorAll(".fb").forEach(x => x.remove()); });
}

function render() {
  const c = CARDS[cur], att = c.type === "attendant", T = Shell.TYPES[c.type];
  Shell.render($("tabs"), CARDS, cur);
  document.title = `AI judge · ${Shell.clean(c.title)}`;
  $("title").textContent = Shell.clean(c.title);
  $("meta").innerHTML = `<span class="type" style="color:${T.color}">${T.name}</span><span aria-hidden="true">·</span><span>Mission ${cur+1} of ${CARDS.length}</span>` + (c.fictional ? '<span class="tag">classroom scenario</span>' : "");
  $("front").textContent = c.front;
  $("annBox").hidden = !att; $("ann").textContent = c.ann || "";
  $("optLabel").textContent = att ? "Choose one" : "Your tasks";
  $("condLabel").textContent = att ? "Your situation" : (c.type === "order" ? "Remember" : "Your goal");
  $("opts").innerHTML = att ? c.routes.map((o,i)=>`<li><b>${"AB"[i]}.</b> ${esc(o[0])} <span class="muted">(${esc(o[1])})</span></li>`).join("")
                            : c.options.map(o=>`<li>${esc(o)}</li>`).join("");
  $("cond").textContent = c.condition;
  $("check").innerHTML = c.items.map(it => {
    const ans = att && it[2] !== undefined && it[2] !== "" ? `A: ${esc(it[1])}<br>B: ${esc(it[2])}` : esc(it[1] || "");
    return `<li><div><div>${esc(it[0])}</div>${ans ? `<div class="ans">${ans}</div>` : ""}</div></li>`;
  }).join("");
  resetResult(); $("tx").value = ""; curSession = null; $("callList").innerHTML = ""; say("");
}

async function post(url, body) {
  const pin = $("pin").value.trim();
  if (!pin) { const e = new Error("오른쪽 위에 교사 PIN을 먼저 넣어 주세요."); $("pin").focus(); throw e; }
  try { localStorage.setItem("judgePin", pin); } catch {}
  const r = await fetch(url, { method:"POST", headers:{ "Content-Type":"application/json" }, body: JSON.stringify({ ...body, pin, mission: cur }) });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error({ pin:"PIN이 맞지 않아요. 다시 확인해 주세요.", not_configured:"아직 설정되지 않은 기능이에요 (API 키 없음).", input:"대화 기록이 비어 있어요." }[j.error] || "응답을 받지 못했어요. 잠시 후 다시 시도해 주세요.");
  return j;
}

async function loadCalls() {
  const list = $("callList"); list.innerHTML = "";
  say("통화 목록을 불러오는 중…");
  try {
    const { sessions } = await post("/api/sessions", {});
    if (!sessions.length) { say("이 미션의 통화가 아직 없어요. 학생이 통화를 마치면 새로고침을 눌러 주세요."); return; }
    say("최신순이에요. 통화를 누르면 바로 판정해요.");
    sessions.forEach((s, i) => {
      const b = document.createElement("button"); b.type = "button"; b.className = "call";
      const t = s.started ? new Date(s.started) : null;
      const day = t && t.toDateString() !== new Date().toDateString() ? t.toLocaleDateString([], { month:"short", day:"numeric" }) + " " : "";
      const dur = s.seconds ? `${Math.floor(s.seconds/60)}:${String(Math.round(s.seconds%60)).padStart(2,"0")}` : "";
      b.dataset.id = s.id;
      b.innerHTML = (s.student ? `<span class="who">${esc(s.student)}</span>` : "") + `<span>${t ? day + t.toLocaleTimeString([], { hour:"2-digit", minute:"2-digit" }) : "?"}</span><span class="d">${dur}</span>` +
        (s.status === "active" ? '<span class="new">통화 중</span>' : i === 0 ? '<span class="new">최신</span>' : "") + (heardOf(s.id) ? '<span class="ear">귀로 OK</span>' : "");
      b.onclick = () => pickCall(s, b);
      list.appendChild(b);
    });
  } catch (e) { say(e.message, true); }
}

async function pickCall(s, btn) {
  if (busy) return;
  [...$("callList").children].forEach(x => x.classList.toggle("on", x === btn));
  say("대화 기록을 불러오는 중…");
  try {
    const { transcript } = await post("/api/sessions", { sessionId: s.id });
    if (!transcript) { say("이 통화에는 대화 기록이 없어요.", true); return; }
    $("tx").value = transcript; curSession = s.id; $("heard").checked = heardOf(s.id);
    await judge();
  } catch (e) { say(e.message, true); }
}

async function judge() {
  const tx = $("tx").value.trim(), c = CARDS[cur];
  if (!tx) { say("통화를 고르거나 대화 기록을 붙여넣어 주세요.", true); return; }
  busy = true; lock(true); const keep = $("heard").checked; resetResult(); $("heard").checked = keep;
  say("판정 중이에요. AI가 3번 확인해서 다수결로 정해요 (약 30초).");
  try {
    const r = await post("/api/judge", { transcript: tx });
    const items = Array.isArray(r.items) ? r.items : [];
    [...$("check").children].forEach((li,i) => {
      const it = items[i] || {}; li.classList.add(it.done ? "yes" : "no");
      const fb = document.createElement("div"); fb.className = "fb";
      fb.innerHTML = (it.evidence ? `<q>${esc(it.evidence)}</q> — ` : "") + esc(it.note || "") + (r.runs > 1 ? ` <span class="v">${it.votes}/${r.runs}</span>` : "");
      li.firstElementChild.appendChild(fb);
    });
    const ok = r.result === "SUCCESS";
    $("verdictRow").className = "verdict " + (ok ? "ok" : "no");
    $("verdict").textContent = ok ? "미션 성공" : "아직이에요";
    $("runs").textContent = (c.type === "attendant" && r.choice ? `${r.choice} 선택 · ` : "") + `${c.items.length}개 중 ${items.filter(x => x.done).length}개 달성` + (r.runs > 1 ? ` · ${r.runs}번 확인해 다수결 (항목 옆 숫자 = 달성으로 본 횟수)` : "");
    $("summary").textContent = r.summary || "";
    const arr = x => Array.isArray(x) ? x : [];
    $("strengths").innerHTML = arr(r.strengths).map(t => `<li>“${esc(t.quote)}”<span class="why">${esc(t.why)}</span></li>`).join("") || "<li class='muted'>—</li>";
    $("tips").innerHTML = arr(r.tips).map(t => `<li class="swap"><s>${esc(t.original)}</s> → <b>${esc(t.better)}</b><span class="why">${esc(t.why)}</span></li>`).join("") || "<li class='muted'>—</li>";
    $("next").textContent = r.next || "";
    $("out").hidden = false; $("fb").hidden = false; say("");
    $("checkPanel").scrollIntoView({ behavior:"smooth", block:"start" });
  } catch (e) { say(e.message, true); }
  finally { busy = false; lock(false); }
}

$("tabs").addEventListener("click", e => { const b = e.target.closest("button"); if (!b) return; cur = +b.dataset.i; render(); if ($("pin").value.trim()) loadCalls(); });
$("toggleAns").addEventListener("click", () => { const p = $("checkPanel"); p.classList.toggle("show-ans"); $("toggleAns").textContent = p.classList.contains("show-ans") ? "정답 숨기기" : "정답 보기"; });
$("clear").addEventListener("click", () => { $("tx").value = ""; curSession = null; resetResult(); say(""); });
$("heard").addEventListener("change", () => {
  if (!curSession) return;
  try { const h = JSON.parse(localStorage.getItem("heard") || "{}"); if ($("heard").checked) h[curSession] = 1; else delete h[curSession]; localStorage.setItem("heard", JSON.stringify(h)); } catch {}
  const chip = [...$("callList").children].find(x => x.dataset.id === curSession);
  if (chip) { chip.querySelector(".ear")?.remove(); if ($("heard").checked) chip.insertAdjacentHTML("beforeend", '<span class="ear">귀로 OK</span>'); }
});
$("judge").addEventListener("click", judge);
$("loadCalls").addEventListener("click", loadCalls);
$("pin").addEventListener("change", () => { if ($("pin").value.trim()) loadCalls(); });

try { $("pin").value = localStorage.getItem("judgePin") || ""; } catch {}
render();
if ($("pin").value.trim()) loadCalls(); else say("오른쪽 위에 교사 PIN을 넣으면 최근 통화가 보여요.");
</script>
</body>
</html>
